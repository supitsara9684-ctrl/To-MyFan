<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Una Carta Que Nunca Esperabas</title>
  <style>
    :root{
      --bg1:#050814;
      --bg2:#0b1230;
      --bg3:#140c2e;
      --text:#f5f7ff;
      --muted:#b9c0e6;
      --accent:#ff7aa8;
      --accent2:#8be9ff;
      --card: rgba(13, 18, 42, .62);
      --card-border: rgba(255,255,255,.14);
      --shadow: 0 20px 80px rgba(0,0,0,.45);
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(139,233,255,.12), transparent 22%),
        radial-gradient(circle at 80% 30%, rgba(255,122,168,.10), transparent 20%),
        radial-gradient(circle at 50% 80%, rgba(130,98,255,.10), transparent 24%),
        linear-gradient(135deg, var(--bg1), var(--bg2) 50%, var(--bg3));
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:
        radial-gradient(circle at 50% 120%, rgba(255,255,255,.08), transparent 35%),
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.04), transparent 20%);
      pointer-events:none;
      mix-blend-mode: screen;
    }

    .stars, .stars::before, .stars::after{
      position:fixed;
      inset:0;
      content:"";
      pointer-events:none;
      background-repeat:repeat;
    }

    .stars{
      opacity:.95;
      background-image:
        radial-gradient(circle at 10px 10px, rgba(255,255,255,.95) 0 1px, transparent 1.5px),
        radial-gradient(circle at 30px 20px, rgba(255,255,255,.8) 0 1px, transparent 1.5px),
        radial-gradient(circle at 50px 60px, rgba(255,255,255,.8) 0 1px, transparent 1.5px);
      background-size: 140px 140px, 180px 180px, 220px 220px;
      animation: drift 80s linear infinite;
    }

    .stars::before{
      opacity:.65;
      background-image:
        radial-gradient(circle at 15px 15px, rgba(139,233,255,.9) 0 1px, transparent 1.5px),
        radial-gradient(circle at 45px 35px, rgba(255,122,168,.8) 0 1px, transparent 1.5px);
      background-size: 240px 240px, 320px 320px;
      animation: drift 140s linear infinite reverse;
      filter: blur(.1px);
    }

    .stars::after{
      opacity:.45;
      background-image:
        radial-gradient(circle at 22px 30px, rgba(255,255,255,.8) 0 1px, transparent 1.5px),
        radial-gradient(circle at 80px 70px, rgba(255,255,255,.8) 0 1px, transparent 1.5px);
      background-size: 360px 360px, 500px 500px;
      animation: drift 220s linear infinite;
    }

    @keyframes drift{
      from { transform: translate3d(0,0,0); }
      to   { transform: translate3d(-180px, 140px, 0); }
    }

    .wrap{
      position:relative;
      z-index:2;
      width:min(860px, calc(100vw - 28px));
      min-height:100svh;
      margin:0 auto;
      display:grid;
      place-items:center;
      padding:24px 0;
    }

    .card{
      width:100%;
      border:1px solid var(--card-border);
      border-radius:28px;
      background: linear-gradient(180deg, rgba(18, 22, 48, .72), rgba(11, 14, 31, .58));
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow:hidden;
      position:relative;
    }

    .topbar{
      display:flex;
      align-items:center;
      gap:8px;
      padding:14px 18px;
      border-bottom:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:999px;
      opacity:.95;
    }
    .dot.red{ background:#ff6b8b; }
    .dot.yellow{ background:#ffd86b; }
    .dot.green{ background:#7df0b2; }

    .content{
      padding:clamp(22px, 4vw, 42px);
      text-align:center;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size:.84rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--muted);
      padding:8px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      margin-bottom:18px;
    }

    h1{
      margin:0 0 14px;
      font-size:clamp(2rem, 5vw, 4rem);
      line-height:1.06;
      letter-spacing:-.04em;
    }

    h2{
      margin:14px 0 10px;
      font-size:clamp(1.25rem, 3vw, 2rem);
      line-height:1.2;
      letter-spacing:-.03em;
    }

    p{
      margin:0;
      font-size:clamp(1rem, 2.2vw, 1.18rem);
      line-height:1.8;
      color:rgba(245,247,255,.92);
    }

    .muted{ color:var(--muted); }

    .type{
      min-height:7.2em;
      white-space:pre-wrap;
      margin:20px auto 0;
      max-width: 42rem;
      font-size:clamp(1rem, 2.4vw, 1.2rem);
    }

    .cursor{
      display:inline-block;
      width:.6ch;
      color:var(--accent2);
      animation: blink 1s step-end infinite;
    }
    @keyframes blink{ 50%{ opacity:0; } }

    .actions{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:26px;
    }

    button{
      appearance:none;
      border:none;
      cursor:pointer;
      border-radius:999px;
      padding:14px 22px;
      font-size:1rem;
      font-weight:700;
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease, background .18s ease;
      color:#08101f;
      background:linear-gradient(135deg, #ffffff, #dff7ff);
      box-shadow: 0 12px 30px rgba(139,233,255,.16);
    }
    button:hover{ transform:translateY(-2px) scale(1.01); }
    button:active{ transform:translateY(0) scale(.99); }
    button.secondary{
      color:var(--text);
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      box-shadow:none;
    }

    .scene{
      position:relative;
      margin:28px auto 0;
      width:min(540px, 100%);
      min-height:220px;
      display:grid;
      place-items:center;
    }

    .glow{
      position:absolute;
      inset:auto;
      width:220px;
      height:220px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(139,233,255,.18), transparent 65%);
      filter: blur(10px);
      transform:translateY(10px);
      opacity:.9;
    }

    .moon{
      position:absolute;
      top:14px;
      right:20px;
      width:72px;
      height:72px;
      border-radius:50%;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,1), rgba(230,237,255,.95) 40%, rgba(199,210,255,.78) 60%, rgba(199,210,255,.45));
      box-shadow: 0 0 36px rgba(255,255,255,.16);
      opacity:.95;
    }

    .cloud{
      position:absolute;
      bottom:26px;
      width:160px;
      height:56px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      filter: blur(.2px);
      box-shadow:
        28px 0 0 0 rgba(255,255,255,.08),
        58px -14px 0 0 rgba(255,255,255,.08),
        88px -2px 0 0 rgba(255,255,255,.08);
      opacity:.7;
    }

    .cloud.left{ left:24px; animation: floaty 5.8s ease-in-out infinite; }
    .cloud.right{ right:24px; animation: floaty 6.5s ease-in-out infinite reverse; }
    @keyframes floaty{
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-8px); }
    }

    .world{
      position:relative;
      width:min(320px, 70vw);
      aspect-ratio:1/1;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.10);
      background:
        radial-gradient(circle at 50% 46%, rgba(139,233,255,.25), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(81,117,255,.50), rgba(23,43,93,.95) 54%, rgba(8,10,24,1) 100%);
      box-shadow: inset 0 0 30px rgba(255,255,255,.12), 0 0 50px rgba(72,106,255,.16);
      overflow:hidden;
      transform-style:preserve-3d;
      animation: spin 32s linear infinite;
    }

    .land{
      position:absolute;
      background:linear-gradient(135deg, rgba(122,255,182,.85), rgba(53,201,150,.68));
      opacity:.9;
      filter: blur(.2px);
      border-radius:50% 44% 52% 40% / 44% 55% 46% 56%;
    }

    .land.one{ width:32%; height:20%; left:16%; top:28%; transform:rotate(-18deg); }
    .land.two{ width:25%; height:15%; left:54%; top:22%; transform:rotate(16deg); }
    .land.three{ width:28%; height:16%; left:50%; top:56%; transform:rotate(-12deg); }
    .land.four{ width:18%; height:12%; left:26%; top:62%; transform:rotate(18deg); }

    .ring{
      position:absolute;
      inset:50% auto auto 50%;
      width:420px;
      height:420px;
      border-radius:50%;
      transform:translate(-50%,-50%);
      border:1px solid rgba(139,233,255,.12);
      box-shadow: 0 0 0 18px rgba(139,233,255,.02);
      animation: pulse 4.8s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes pulse{
      0%,100%{ transform:translate(-50%,-50%) scale(1); opacity:.55; }
      50%{ transform:translate(-50%,-50%) scale(1.03); opacity:1; }
    }

    @keyframes spin{
      from{ transform:rotate(0deg); }
      to{ transform:rotate(360deg); }
    }

    .letter{
      width:min(600px, 100%);
      margin:0 auto;
      border-radius:24px;
      padding:22px 20px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.10);
      text-align:left;
      line-height:1.95;
      position:relative;
      overflow:hidden;
    }

    .letter::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
      transform:translateX(-100%);
      animation: shine 4.5s ease-in-out infinite;
    }

    @keyframes shine{
      0%, 65%{ transform:translateX(-100%); }
      100%{ transform:translateX(100%); }
    }

    .sig{
      margin-top:18px;
      font-size:1.05rem;
      color:#fff;
      font-weight:700;
      text-align:center;
    }

    .heart{
      position:fixed;
      left:0;
      top:0;
      pointer-events:none;
      z-index:5;
      font-size:18px;
      animation: rise linear forwards;
      text-shadow: 0 4px 14px rgba(255,122,168,.4);
    }

    @keyframes rise{
      from{
        transform:translate3d(0,0,0) scale(.9);
        opacity:1;
      }
      to{
        transform:translate3d(var(--dx), -120vh, 0) scale(1.7);
        opacity:0;
      }
    }

    .hidden{ display:none !important; }

    .mini{
      font-size:.92rem;
      color:var(--muted);
      margin-top:16px;
    }

    .footer-note{
      margin-top:14px;
      font-size:.86rem;
      color:rgba(185,192,230,.78);
    }

    @media (max-width: 640px){
      .content{ padding:20px 18px 22px; }
      .type{ min-height:8.2em; }
      .world{ width:min(280px, 74vw); }
      .ring{ width:320px; height:320px; }
      .letter{ text-align:center; }
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <div class="wrap">
    <main class="card" aria-live="polite">
      <div class="topbar" aria-hidden="true">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>

      <section class="content" id="screen">
        <div class="badge" id="badge">una carta misteriosa</div>
        <h1 id="title">Hay algo esperándote…</h1>

        <div class="type"
