<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hay algo esperándote...</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Great+Vibes&display=swap');

    :root {
      --bg-night: #05050e;
      --accent-gold: #f39c12;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-night);
      color: #ffffff;
      font-family: 'Caveat', cursive; /* ฟอนต์ลายมือน่ารัก */
      min-height: 100vh;
      overflow: hidden;
      transition: background 4s ease-in-out;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    body.sunrise-bg {
      background: linear-gradient(to top, #ffd194, #f8bbd0, #2b0910) !important;
      color: #2c3e50;
    }

    canvas#starsCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #hearts-container, #sunflower-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      font-size: 22px;
      animation: floatUp 4s linear forwards;
      bottom: -30px;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
    }

    /* Sunflowers Blooming from bottom */
    .sunflower {
      position: absolute;
      bottom: -10px;
      font-size: 45px;
      transform-origin: bottom center;
      animation: bloom 2s ease-out forwards;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
    }

    @keyframes bloom {
      0% { transform: scale(0) translateY(50px) rotate(-10deg); opacity: 0; }
      70% { transform: scale(1.1) translateY(-5px) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) translateY(0) rotate(0deg); opacity: 1; }
    }

    /* Music Button */
    .music-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 100;
      font-size: 18px;
      backdrop-filter: blur(5px);
      transition: all 0.3s;
    }

    .music-btn.playing {
      animation: spin 4s linear infinite;
      box-shadow: 0 0 12px rgba(243, 156, 18, 0.5);
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Sparkles */
    .sparkle {
      position: fixed;
      pointer-events: none;
      background: #ffd700;
      border-radius: 50%;
      animation: sparkleFade 0.8s ease-out forwards;
      z-index: 99;
    }

    @keyframes sparkleFade {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0); opacity: 0; }
    }

    .main-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 580px;
      text-align: center;
      padding: 20px;
    }

    .section {
      display: none;
      opacity: 0;
      transition: opacity 1.2s ease;
      flex-direction: column;
      align-items: center;
    }

    .section.active {
      display: flex;
      opacity: 1;
    }

    .text-box {
      font-size: 1.8rem; /* ปรับขนาดให้เข้ากับฟอนต์ลายมือ */
      letter-spacing: 1px;
      line-height: 1.6;
      min-height: 100px;
      margin-bottom: 30px;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
      white-space: pre-line;
    }

    .btn-action {
      background: transparent;
      border: 2px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 10px 28px;
      font-family: 'Caveat', cursive;
      font-size: 1.4rem;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 30px;
      transition: all 0.4s;
      box-shadow: 0 0 15px rgba(243, 156, 18, 0.2);
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-action:hover, .btn-action:active {
      background: var(--accent-gold);
      color: #000;
      box-shadow: 0 0 25px rgba(243, 156, 18, 0.6);
    }

    .typewriter-cursor::after {
      content: '|';
      animation: blink 0.7s infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .final-line {
      opacity: 0;
      transition: opacity 1.5s ease;
      margin-bottom: 12px;
      font-size: 1.9rem;
    }

    .final-line.show { opacity: 1; }

    .signature-box {
      margin-top: 25px;
      opacity: 0;
      transition: opacity 2s ease;
    }

    .signature-box.show { opacity: 1; }

    .signature-title {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: #8b0000;
    }

    .signature-name {
      font-family: 'Great Vibes', cursive;
      font-size: 3.8rem;
      color: #8b0000;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <canvas id="starsCanvas"></canvas>
  <div id="hearts-container"></div>
  <div id="sunflower-container"></div>

  <!-- Music Vinyl Toggle Button -->
  <div class="music-btn" id="musicToggle" onclick="toggleAudio()">🎵</div>

  <!-- Audio Background: Eres Tú (Acoustic / Piano Instrumental) -->
  <audio id="bgMusic" loop preload="auto" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a816a7.mp3?filename=romantic-acoustic-guitar-10875.mp3"></audio>

  <div class="main-container">
    
    <!-- PAGE 1 -->
    <div class="section active" id="sec1">
      <div class="text-box typewriter-cursor" id="text1"></div>
      <button class="btn-action" id="btn1" style="display:none;" onclick="nextPage(2)">Continuar ➔</button>
    </div>

    <!-- PAGE 2 -->
    <div class="section" id="sec2">
      <div class="text-box typewriter-cursor" id="text2"></div>
      <button class="btn-action" id="btn2" style="display:none;" onclick="nextPage(3)">Continuar ➔</button>
    </div>

    <!-- PAGE 3 -->
    <div class="section" id="sec3">
      <div class="text-box typewriter-cursor" id="text3"></div>
      <button class="btn-action" id="btn3" style="display:none;" onclick="nextPage(4)">Continuar ➔</button>
    </div>

    <!-- PAGE 4 -->
    <div class="section" id="sec4">
      <div class="text-box typewriter-cursor" id="text4"></div>
      <button class="btn-action" id="btn4" style="display:none;" onclick="triggerSunrise()">Continuar ➔</button>
    </div>

    <!-- PAGE 5 (FINAL) -->
    <div class="section" id="sec5">
      <div id="finalMessageContainer">
        <div class="final-line" id="fl1">Gracias por aparecer en mi vida.</div>
        <div class="final-line" id="fl2">Gracias por elegirme.</div>
        <div class="final-line" id="fl3">Gracias por ser tú.</div>
        <div class="final-line" id="fl4" style="font-size: 2.3rem; font-weight: bold; margin-top: 15px; color: #b30000;">Te amo.</div>
      </div>

      <div class="signature-box" id="sigBox">
        <div class="signature-title">Con amor,</div>
        <div class="signature-name">Renita. ❤️</div>
      </div>
    </div>

  </div>

  <script>
    /* --- SPARKLES ON TAP/CLICK --- */
    window.addEventListener('click', (e) => {
      for (let i = 0; i < 5; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        const size = Math.random() * 6 + 4;
        sparkle.style.width = size + 'px';
        sparkle.style.height = size + 'px';
        sparkle.style.left = (e.clientX + (Math.random() * 20 - 10)) + 'px';
        sparkle.style.top = (e.clientY + (Math.random() * 20 - 10)) + 'px';
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 800);
      }
    });

    /* --- AUDIO SYNTH & TOGGLE --- */
    let audioCtx = null;
    
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTick() {
      try {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch(e) {}
    }

    function startMusic() {
      initAudioContext();
      const bgMusic = document.getElementById('bgMusic');
      const btn = document.getElementById('musicToggle');
      if (bgMusic && bgMusic.paused) {
        bgMusic.play().then(() => {
          btn.classList.add('playing');
        }).catch(() => {});
      }
    }

    function toggleAudio() {
      initAudioContext();
      const bgMusic = document.getElementById('bgMusic');
      const btn = document.getElementById('musicToggle');
      if (bgMusic.paused) {
        bgMusic.play();
        btn.classList.add('playing');
      } else {
        bgMusic.pause();
        btn.classList.remove('playing');
      }
    }

    /* --- CANVAS STARS --- */
    const canvas = document.getElementById('starsCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [], shootingStars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for(let i = 0; i < 150; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.5,
        alpha: Math.random(),
        speed: Math.random() * 0.02 + 0.005
      });
    }

    function addShootingStar() {
      shootingStars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * (canvas.height / 2),
        len: Math.random() * 80 + 50,
        speed: Math.random() * 8 + 6,
        size: Math.random() * 1.2 + 0.2
      });
    }
    setInterval(addShootingStar, 10000);

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
        ctx.globalAlpha = Math.abs(star.alpha);
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      shootingStars.forEach((sStar, index) => {
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
        ctx.lineWidth = sStar.size;
        ctx.beginPath();
        ctx.moveTo(sStar.x, sStar.y);
        ctx.lineTo(sStar.x - sStar.len, sStar.y + sStar.len);
        ctx.stroke();

        sStar.x += sStar.speed;
        sStar.y += sStar.speed;

        if (sStar.x > canvas.width || sStar.y > canvas.height) {
          shootingStars.splice(index, 1);
        }
      });
      requestAnimationFrame(animateStars);
    }
    animateStars();

    /* --- FLOATING HEARTS & SUNFLOWERS --- */
    function spawnHeart() {
      const container = document.getElementById('hearts-container');
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 90 + 5 + 'vw';
      heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
      container.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }

    function plantSunflowers() {
      const container = document.getElementById('sunflower-container');
      const flowerPositions = [5, 18, 32, 50, 68, 82, 92]; // ตำแหน่งการงอกของดอกไม้ด้านล่าง
      
      flowerPositions.forEach((pos, index) => {
        setTimeout(() => {
          const sf = document.createElement('div');
          sf.className = 'sunflower';
          sf.innerHTML = '🌻';
          sf.style.left = pos + 'vw';
          container.appendChild(sf);
        }, index * 300); // ทยอยงอกทีละดอกอย่างเป็นธรรมชาติ
      });
    }

    /* --- TYPEWRITER LOGIC --- */
    const texts = {
      1: "Hay algo esperándote…",
      2: "Nunca imaginé que alguien tan lejos…\n\npudiera sentirse tan cerca.",
      3: "Gracias…\npor cada sonrisa.\npor cada llamada.\npor cada momento.",
      4: "Dicen que la distancia cambia las cosas…\n\nPero nunca cambió lo que siento por ti."
    };

    function typeText(pageIndex, callback) {
      const element = document.getElementById(`text${pageIndex}`);
      const fullText = texts[pageIndex];
      let charIndex = 0;
      element.textContent = "";

      function type() {
        if (charIndex < fullText.length) {
          element.textContent += fullText.charAt(charIndex);
          playTick();
          charIndex++;
          setTimeout(type, 75);
        } else {
          element.classList.remove("typewriter-cursor");
          if(callback) callback();
        }
      }
      type();
    }

    // Auto start page 1
    setTimeout(() => {
      typeText(1, () => {
        document.getElementById("btn1").style.display = "inline-block";
      });
    }, 800);

    function nextPage(pageNum) {
      startMusic();
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(`sec${pageNum}`).classList.add('active');

      typeText(pageNum, () => {
        document.getElementById(`btn${pageNum}`).style.display = "inline-block";
      });
    }

    /* --- FINAL PAGE --- */
    function triggerSunrise() {
      startMusic();
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById('sec5').classList.add('active');
      document.body.classList.add("sunrise-bg");

      plantSunflowers(); // ดอกทานตะวันค่อยๆ บานสะพรั่งขึ้นมา
      setInterval(spawnHeart, 500);

      const lines = ['fl1', 'fl2', 'fl3', 'fl4'];
      lines.forEach((id, index) => {
        setTimeout(() => {
          document.getElementById(id).classList.add('show');
        }, (index + 1) * 1200);
      });

      // Show "Con amor, Renita. ❤️" exactly 2 seconds after "Te amo."
      setTimeout(() => {
        document.getElementById('sigBox').classList.add('show');
      }, (lines.length * 1200) + 2000);
    }
  </script>
</body>
</html>
