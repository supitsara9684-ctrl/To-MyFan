<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Map / Memory</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* พื้นหลังจักรวาล (ดวงดาวและอวกาศ) */
        body {
            background-color: #050510;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(circle at center, #1b1b3a 0%, #050510 100%);
            background-size: 550px 550px, 100% 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
        }

        /* กล่องเนื้อหาแผนที่ วางอยู่บนจักรวาลโดยตรง ไม่มีรูปภาพอื่นมาทับซ้อนให้รก */
        .map-section-container {
            background: rgba(15, 15, 30, 0.75); /* ความโปร่งแสงกำลังดี เห็นดาวรำไรข้างหลังแต่ตัวหนังสือชัด */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .map-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffb7b2;
            text-shadow: 0 2px 10px rgba(255, 183, 178, 0.3);
        }

        /* ส่วนแสดงแผนที่ (ถ้ามี iframe Google Maps ให้ใส่ตรงนี้) */
        .map-frame-box {
            width: 100%;
            height: 300px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            background: #000;
        }

        .map-frame-box iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* ข้อความบรรยายพิกัดหรือความทรงจำ ให้อ่านง่าย ชัดเจน */
        .map-description {
            font-size: 16px;
            line-height: 1.6;
            color: #f0f0f5;
        }
    </style>
</head>
<body>

    <div class="map-section-container">
        <div class="map-title">📍 สถานที่ของเรา</div>
        
        <!-- กรอบสำหรับใส่แผนที่ (เช่น Google Maps Embed) -->
        <div class="map-frame-box">
            <!-- แทนที่ลิงก์ src ด้วยแผนที่ของคุณ -->
            <iframe src="https://www.google.com/maps/embed?pb=..." allowfullscreen="" loading="lazy"></iframe>
        </div>

        <div class="map-description">
            ที่นี่คือจุดเริ่มต้นความทรงจำของเรา... อยู่ท่ามกลางจักรวาลที่กว้างใหญ่ ✨
        </div>
    </div>

</body>
</html>
